# ============================================================================
# Verificação a cada push e pull request.
#
# A Vercel publica direto do `main`. O build dela é o mesmo `npm run build`
# daqui, então quando este job passa a publicação também passa — e quando ele
# falha, o erro aparece no pull request em vez de num deploy quebrado.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar
        run: npm ci

      # Antes do typecheck: o `@disparoy/dominio` é consumido pelo `dist/`,
      # que é gitignorado e não existe num clone limpo.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # `shared/` é copiado byte a byte entre este repositório e o do backend, e
      # o processo para manter isso era "lembre de copiar e rodar diff -rq".
      # Divergência aqui produz o pior tipo de bug: normalizar um telefone passa
      # a dar resultado diferente na API e no painel, os dois compilam, os dois
      # passam nos testes, e a diferença só aparece em produção.
      #
      # O CI clona um repositório só e não tem o outro para comparar, então a
      # conferência é contra o hash versionado nos dois. O passo existia apenas
      # no backend: mexer em `shared/` a partir daqui não acusava nada, que é
      # metade de uma guarda — e a metade que faltava era justamente a deste
      # lado.
      - name: shared/ não divergiu do outro repositório
        run: npm run compartilhado:verificar

      - name: Nenhum segredo versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::Arquivo .env versionado. Remova do índice e troque as credenciais."
            exit 1
          fi
