# ============================================================================
# Verificação a cada push e pull request.
#
# A Vercel publica direto do `main`. O build dela é o mesmo `npm run build`
# daqui, então quando este job passa a publicação também passa — e quando ele
# falha, o erro aparece no pull request em vez de num deploy quebrado.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar
        run: npm ci

      # Antes do typecheck: o `@disparoy/dominio` é consumido pelo `dist/`,
      # que é gitignorado e não existe num clone limpo.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O painel não tem exceção a declarar — nenhuma dependência de produção com
      # aviso aberto. Se um aparecer, o CI reprova aqui, que é o objetivo: descobrir
      # no pull request e não no dia em que virar incidente. O backend usa um script
      # no lugar deste comando porque lá existe um aviso sem correção publicada, que
      # precisa de exceção nominal.
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      # `shared/` é copiado byte a byte entre os dois repositórios, e o processo
      # para manter isso era "lembre de copiar e rodar diff -rq". Divergência
      # aqui produz o pior tipo de bug: normalizar um telefone passa a dar
      # resultado diferente na API e no painel, os dois compilam, os dois passam
      # nos testes, e a diferença só aparece em produção. O CI clona um repo só,
      # então a conferência é contra o hash versionado nos dois.
      - name: shared/ não divergiu do outro repositório
        run: npm run compartilhado:verificar

      - name: Nenhum segredo versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::Arquivo .env versionado. Remova do índice e troque as credenciais."
            exit 1
          fi
